name: Create Release Tag

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create (e.g. v1.2.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            raw_tag="${INPUT_TAG}"
          else
            raw_tag="${GITHUB_REF_NAME}"
          fi
          # Normalize: ensure v prefix
          tag="${raw_tag}"
          [[ "${tag:0:1}" != "v" ]] && tag="v${tag}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

          # Tag already exists (tag push) -> notes for that tag;
          # otherwise (manual run with a new tag) -> unreleased commits labelled as the new tag.
          if git rev-parse -q --verify "refs/tags/${tag}" > /dev/null; then
            echo "cliff_args=--latest --strip header" >> "${GITHUB_OUTPUT}"
          else
            echo "cliff_args=--unreleased --tag ${tag} --strip header" >> "${GITHUB_OUTPUT}"
          fi

      # Release notes are generated from conventional commits (see cliff.toml),
      # since this repo does not use pull requests.
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: ${{ steps.version.outputs.cliff_args }}
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file RELEASE_NOTES.md \
            --target "${GITHUB_SHA}"
